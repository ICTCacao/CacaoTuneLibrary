[package]
name = "cacaotunelibrarywin"
version = "1.0.10"
description = "CacaoTuneLibrary Windows 版（YouTube の音声を m4a / mp3 にしてチャンネル別の棚に並べる）"
authors = ["ICTCacao"]
edition = "2021"

[lib]
name = "cacaotunelibrarywin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time", "fs"] }
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
