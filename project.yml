name: CacaoTuneLibrary
options:
  bundleIdPrefix: com.ictcacao
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  # YouTube の URL を入れると、音声だけを m4a（または mp3）にして保存する。実作業は yt-dlp + ffmpeg（Homebrew）
  CacaoTuneLibrary:
    type: application
    platform: macOS
    sources:
      - path: CacaoTuneLibrary
        excludes:
          - "Resources/*.plist"
      - path: LICENSE
        buildPhase: resources
    info:
      path: CacaoTuneLibrary/Resources/Info.plist
      properties:
        CFBundleDisplayName: CacaoTuneLibrary
        CFBundleName: CacaoTuneLibrary
        CFBundleShortVersionString: "1.0.9"
        CFBundleVersion: "1.0.9"
        LSMinimumSystemVersion: "14.0"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations: [ja, en]
        LSApplicationCategoryType: public.app-category.music
        NSHumanReadableCopyright: "© 2026 ICTCacao"
    # yt-dlp / ffmpeg を外部プロセスとして動かし、任意のフォルダに保存するため、サンドボックスは使わない
    entitlements:
      path: CacaoTuneLibrary/Resources/CacaoTuneLibrary.entitlements
      properties:
        com.apple.security.app-sandbox: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ictcacao.CacaoTuneLibrary
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  CacaoTuneLibrary:
    build:
      targets:
        CacaoTuneLibrary: all
    run:
      config: Debug
